<svg viewBox="0 80 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#FCFBF7"/>

  <!-- Tiered trapezoids: A (top, narrow, strongest) to F (bottom, wide, weakest) -->
  <!-- Geometry: centered pyramid, x-center 300 -->
  <g stroke="#FCFBF7" stroke-width="2">
    <!-- A -->
    <polygon points="240,95 360,95 372,150 228,150" fill="#15454A"/>
    <!-- B -->
    <polygon points="228,152 372,152 388,210 212,210" fill="#1B4D52"/>
    <!-- C -->
    <polygon points="212,212 388,212 408,275 192,275" fill="#2E6B72"/>
    <!-- D -->
    <polygon points="192,277 408,277 430,345 170,345" fill="#5E9298"/>
    <!-- E -->
    <polygon points="170,347 430,347 454,420 146,420" fill="#C2A878"/>
    <!-- F -->
    <polygon points="146,422 454,422 480,500 120,500" fill="#C98A5E"/>
  </g>
  <!-- Grade letters -->
  <g font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Georgia, serif">
    <text x="300" y="130">A</text>
    <text x="300" y="190">B</text>
    <text x="300" y="252">C</text>
    <text x="300" y="320">D</text>
    <text x="300" y="392">E</text>
    <text x="300" y="470">F</text>
  </g>

  <!-- Right-side annotations -->
  <g font-size="13" fill="#1C2B36">
    <line x1="372" y1="122" x2="520" y2="122" stroke="#C9CFC9"/>
    <text x="528" y="118" font-weight="700">A — Individual cohort + dose reconstruction</text>
    <text x="528" y="136" fill="#5A6B73" font-size="12">Life Span Study · Semipalatinsk · Camp Lejeune (A/B)</text>

    <line x1="388" y1="181" x2="520" y2="181" stroke="#C9CFC9"/>
    <text x="528" y="177" font-weight="700">B — Cohort/registry, incomplete exposure data</text>
    <text x="528" y="195" fill="#5A6B73" font-size="12">Khamisiyah · U.K. Gulf War (null) · Agent Orange (B/C)</text>

    <line x1="408" y1="243" x2="520" y2="243" stroke="#C9CFC9"/>
    <text x="528" y="239" font-weight="700">C — Biomarker / cytogenetic / mechanistic</text>
    <text x="528" y="257" fill="#5A6B73" font-size="12">Bhopal cytogenetics · Vietnamese SCE frequencies</text>

    <line x1="430" y1="311" x2="520" y2="311" stroke="#C9CFC9"/>
    <text x="528" y="307" font-weight="700">D — Legal / policy presumption</text>
    <text x="528" y="325" fill="#5A6B73" font-size="12">PACT Act presumptive-condition lists (not effect estimates)</text>

    <line x1="454" y1="383" x2="520" y2="383" stroke="#C9CFC9"/>
    <text x="528" y="379" font-weight="700">E — Modeled environmental cancer-risk</text>
    <text x="528" y="397" fill="#5A6B73" font-size="12">Louisiana "Cancer Alley" air-toxics risk (not incidence)</text>

    <line x1="480" y1="461" x2="520" y2="461" stroke="#C9CFC9"/>
    <text x="528" y="457" font-weight="700">F — Community survey / immature latency</text>
    <text x="528" y="475" fill="#5A6B73" font-size="12">Bhopal survey ratios · Beirut Port · Fallujah (F/B)</text>
  </g>

  <!-- Strength gradient arrow -->
  <g>
    <text x="92" y="92" font-size="12" fill="#5A6B73" transform="rotate(-90 92 92)" text-anchor="end">weaker inference</text>
    <text x="92" y="500" font-size="12" fill="#5A6B73" transform="rotate(-90 92 500)" text-anchor="start">stronger inference</text>
    <line x1="100" y1="500" x2="100" y2="110" stroke="#7C8A86" stroke-width="1.4" marker-end="url(#up)"/>
  </g>
  <text x="40" y="560" font-size="12" fill="#5A6B73">The Saudi Eastern Province registry contrast is charted separately as an ecological, hypothesis-generating signal.</text>
  <defs>
    <marker id="up" markerWidth="9" markerHeight="9" refX="4.5" refY="2" orient="auto">
      <path d="M0 9 L4.5 0 L9 9 z" fill="#7C8A86"/>
    </marker>
  </defs>
</svg>
