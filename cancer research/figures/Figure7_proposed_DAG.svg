<svg viewBox="0 80 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#FCFBF7"/>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8C99A0"/>
    </marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#BE7B45"/>
    </marker>
    <marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1B4D52"/>
    </marker>
  </defs>

  <!-- ===== Causal spine ===== -->
  <rect x="55" y="265" width="190" height="78" rx="8" fill="#FBEFE2" stroke="#BE7B45" stroke-width="2"/>
  <text x="150" y="292" text-anchor="middle" font-size="14.5" font-weight="700" fill="#BE7B45">Environmental</text>
  <text x="150" y="311" text-anchor="middle" font-size="14.5" font-weight="700" fill="#BE7B45">exposure</text>
  <text x="150" y="331" text-anchor="middle" font-size="12" fill="#A8842F">1991 plume + baseline</text>

  <rect x="355" y="265" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#5E9298" stroke-width="2"/>
  <text x="450" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#2E6B72">Tissue mutational /</text>
  <text x="450" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#2E6B72">inflammatory burden</text>
  <text x="450" y="331" text-anchor="middle" font-size="12" fill="#5A6B73">mediator (unobserved)</text>

  <rect x="655" y="265" width="190" height="78" rx="8" fill="#EAF1F0" stroke="#1B4D52" stroke-width="2"/>
  <text x="750" y="295" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B4D52">Cancer incidence</text>
  <text x="750" y="314" text-anchor="middle" font-size="12" fill="#37606A">marker sites, by region-year</text>
  <text x="750" y="330" text-anchor="middle" font-size="12" fill="#37606A">(SCR microdata outcome)</text>

  <line x1="245" y1="304" x2="353" y2="304" stroke="#1B4D52" stroke-width="2.6" marker-end="url(#t)"/>
  <line x1="545" y1="304" x2="653" y2="304" stroke="#1B4D52" stroke-width="2.6" marker-end="url(#t)"/>
  <text x="299" y="294" text-anchor="middle" font-size="12" fill="#1B4D52" font-weight="700">estimand</text>

  <!-- ===== Covariate boxes ===== -->
  <g font-size="12" fill="#1C2B36">
    <rect x="40" y="120" width="120" height="38" rx="6" fill="#F2F0E9" stroke="#C9CFC9"/>
    <text x="100" y="144" text-anchor="middle">Occupation</text>
    <rect x="40" y="172" width="120" height="38" rx="6" fill="#F2F0E9" stroke="#C9CFC9"/>
    <text x="100" y="196" text-anchor="middle">Urbanization</text>
    <rect x="40" y="462" width="120" height="38" rx="6" fill="#F2F0E9" stroke="#C9CFC9"/>
    <text x="100" y="486" text-anchor="middle">Migration</text>

    <rect x="740" y="120" width="130" height="38" rx="6" fill="#F2F0E9" stroke="#C9CFC9"/>
    <text x="805" y="144" text-anchor="middle">Healthcare access</text>
    <rect x="740" y="172" width="130" height="38" rx="6" fill="#F2F0E9" stroke="#C9CFC9"/>
    <text x="805" y="196" text-anchor="middle">Screening intensity</text>
    <rect x="600" y="462" width="120" height="38" rx="6" fill="#F2F0E9" stroke="#C9CFC9"/>
    <text x="660" y="486" text-anchor="middle">Registry compl.</text>
    <rect x="740" y="462" width="130" height="38" rx="6" fill="#F2F0E9" stroke="#C9CFC9"/>
    <text x="805" y="486" text-anchor="middle">Age / sex structure</text>
  </g>

  <rect x="300" y="95" width="120" height="36" rx="6" fill="#EDE4D6" stroke="#BE7B45" stroke-width="1.3"/>
  <text x="360" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#A8842F">Smoking</text>

  <!-- ===== Distinct orthogonal connectors (one per covariate) ===== -->
  <!-- LEFT into exposure top: Occupation (x110) and Urbanization (x160), separate lanes -->
  <g stroke="#8C99A0" stroke-width="1.5" fill="none">
    <path d="M80 158 V238 H110 V265" marker-end="url(#g)"/>
    <path d="M120 210 V252 H160 V265" marker-end="url(#g)"/>
    <!-- Migration into exposure bottom -->
    <path d="M100 462 V378 H150 V343" marker-end="url(#g)"/>
  </g>
  <!-- RIGHT into incidence top: Healthcare (x790) and Screening (x740), separate lanes -->
  <g stroke="#8C99A0" stroke-width="1.5" fill="none">
    <path d="M825 158 V238 H790 V265" marker-end="url(#g)"/>
    <path d="M785 210 V252 H740 V265" marker-end="url(#g)"/>
    <!-- bottom-right into incidence bottom: Registry (x720) and Age/sex (x780), separate lanes -->
    <path d="M660 462 V378 H720 V343" marker-end="url(#g)"/>
    <path d="M805 462 V378 H780 V343" marker-end="url(#g)"/>
  </g>
  <!-- Smoking: dual-path confounder into BOTH exposure and incidence (clay) -->
  <g stroke="#BE7B45" stroke-width="1.6" fill="none">
    <path d="M300 113 H200 V265" marker-end="url(#c)"/>
    <path d="M420 113 H700 V265" marker-end="url(#c)"/>
  </g>

  <text x="40" y="545" font-size="12" fill="#5A6B73">Teal: causal path to be estimated. Grey: confounders / ascertainment factors, each a separate edge, entered as covariates, fixed effects,</text>
  <text x="40" y="563" font-size="12" fill="#5A6B73">or negative-control comparisons. Smoking (clay) is the key dual-path confounder; a never-smoker lung-cancer subcohort blocks it directly.</text>
</svg>
