<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chartsmith</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="taskpane.css" />
    <!-- Office.js (loaded by the host; CDN here for sideload). -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- JSZip — used to crack open the .pptx and pull theme1.xml. -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  </head>
  <body>
    <header class="cs-header">
      <h1>Chartsmith</h1>
      <span id="status-pill" class="cs-pill cs-pill--idle">idle</span>
    </header>

    <!-- ============== Settings ============== -->
    <details class="cs-section" id="settings-section">
      <summary>Server &amp; design system</summary>
      <div class="cs-row">
        <label>MCP endpoint
          <input id="mcp-url" type="url" placeholder="http://localhost:3333/mcp" />
        </label>
      </div>
      <div class="cs-row">
        <label>Bearer token (optional)
          <input id="mcp-token" type="password" placeholder="if the server requires --auth-token" autocomplete="off" />
        </label>
      </div>
      <div class="cs-row">
        <label>Design system
          <select id="design-system">
            <option value="default">default</option>
            <option value="thinkcell">thinkcell</option>
            <option value="minimal">minimal</option>
          </select>
        </label>
        <button id="refresh-ds">Refresh</button>
      </div>
      <div class="cs-row">
        <button id="use-deck-theme" title="Read theme1.xml from the active deck and register it as a design system">
          Use deck theme
        </button>
        <span id="deck-theme-status" class="cs-muted"></span>
      </div>
    </details>

    <!-- ============== Chart type picker ============== -->
    <section class="cs-section">
      <h2>1. Chart type</h2>
      <div id="type-picker" class="cs-thumbs"><!-- thumbs injected by JS --></div>
    </section>

    <!-- ============== Data grid ============== -->
    <section class="cs-section">
      <h2>2. Data</h2>
      <div class="cs-row">
        <label>Title
          <input id="chart-title" type="text" placeholder="Chart title" />
        </label>
      </div>
      <div id="grid-host"></div>
      <div class="cs-row cs-row--tight">
        <button id="add-row">+ row</button>
        <button id="add-col">+ column</button>
        <button id="del-row">− row</button>
        <button id="del-col">− column</button>
      </div>
    </section>

    <!-- ============== Annotations ============== -->
    <section class="cs-section">
      <h2>3. Annotations</h2>
      <div class="cs-row cs-row--tight">
        <label class="cs-toggle">
          <input id="ann-cagr" type="checkbox" />
          <span>CAGR arrow</span>
        </label>
        <label class="cs-toggle">
          <input id="ann-totals" type="checkbox" />
          <span>Total labels</span>
        </label>
        <label class="cs-toggle">
          <input id="ann-delta" type="checkbox" />
          <span>Delta</span>
        </label>
        <label class="cs-toggle">
          <input id="ann-refline" type="checkbox" />
          <span>Reference line</span>
        </label>
      </div>
      <div class="cs-row cs-row--tight" id="refline-config" hidden>
        <label>Value
          <input id="ann-refline-value" type="number" step="any" placeholder="e.g. 100" />
        </label>
        <label>Label
          <input id="ann-refline-label" type="text" placeholder="Target" />
        </label>
      </div>
    </section>

    <!-- ============== Live preview ============== -->
    <section class="cs-section">
      <h2>4. Preview</h2>
      <div id="preview-host" class="cs-preview"></div>
      <div id="warnings" class="cs-warnings"></div>
    </section>

    <!-- ============== Actions ============== -->
    <section class="cs-section cs-actions-section">
      <div class="cs-row cs-row--tight cs-mode-row">
        <span class="cs-mode-label">Insert as</span>
        <label class="cs-toggle">
          <input type="radio" name="insert-mode" value="image" id="mode-image" checked />
          <span>Image (with annotations)</span>
        </label>
        <label class="cs-toggle">
          <input type="radio" name="insert-mode" value="native" id="mode-native" />
          <span>Native chart (editable)</span>
        </label>
      </div>
      <div class="cs-actions">
        <button id="btn-insert" class="cs-primary">Insert into slide</button>
        <button id="btn-update" disabled>Update selected</button>
      </div>
    </section>

    <script type="module" src="taskpane.js"></script>
  </body>
</html>
